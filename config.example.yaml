# 研报辅助 Agent 配置文件示例
# 复制本文件为 config.yaml，然后按你的需要修改

# ===== 大模型配置 =====
llm:
  base_url: "https://api.openai.com/v1"   # 你的 LLM API 地址
  api_key: "sk-xxxxxxxxxxxxxxxx"             # 你的 API Key
  model: "gpt-4o-mini"                    # 使用的模型名称
  temperature: 0.3                        # 温度（0=严谨，1=发散）

# ===== 数据模式 =====
mode: auto                                # auto / online / offline
# auto: 有 key 就用在线，没 key 就离线
# online: 强制在线（没 key 会报错）
# offline: 强制离线（用样例数据演示）

# ===== 输出配置 =====
output:
  dir: "output"                           # 报告输出目录
  formats: ["md", "html"]                 # 导出格式（可选 md/html/pdf）

# ===== 自选股（用于 daily / monitor 命令）=====
watchlist:
  - "600519"    # 贵州茅台
  - "000858"    # 五粮液
  - "300750"    # 宁德时代
  - "601318"    # 中国平安
  - "000001"    # 平安银行

# ===== 推送配置 =====
notify:
  feishu_webhook_url: ""                   # 飞书机器人 webhook 地址
  feishu_secret: ""                       # 飞书签名密钥（可选）
  wecom_webhook_key: ""                   # 企业微信机器人 key

# ===== 监控配置（monitor 命令）=====
monitor:
  threshold: 5.0                          # 涨跌幅阈值（%）
  interval: 60                            # 轮询间隔（秒）

# ===== 高级选项 =====
advanced:
  deep_search_rounds: 2                   # 深挖模式下的补充检索轮数
  max_review_rounds: 1                    # 报告审校最大轮数
  cache_enabled: true                     # 是否启用当天数据缓存
