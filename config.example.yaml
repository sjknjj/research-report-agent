# 研报辅助 Agent 配置文件示例
# 复制本文件为 config.yaml，然后按你的需要修改

# ===== 大模型配置 =====
llm:
  base_url: "https://api.openai.com/v1"   # 你的 LLM API 地址
  api_key: "sk-xxxxxxxxxxxxxxxx"             # 你的 API Key
  model: "gpt-4o-mini"                    # 使用的模型名称
  temperature: 0.3                        # 温度（0=严谨，1=发散）

# ===== 数据模式 =====
mode: auto                                # auto / online / offline
# auto: 有 key 就用在线，没 key 就离线
# online: 强制在线（没 key 会报错）
# offline: 强制离线（用样例数据演示）

# ===== 输出配置 =====
output:
  dir: "output"                           # 报告输出目录
  formats: ["md", "html"]                 # 导出格式（可选 md/html/pdf）

# ===== 自选股（用于 daily / monitor 命令）=====
watchlist:
  - "600519"    # 贵州茅台
  - "000858"    # 五粮液
  - "300750"    # 宁德时代
  - "601318"    # 中国平安
  - "000001"    # 平安银行

# ===== 推送配置 =====
notify:
  feishu_webhook_url: ""                   # 飞书机器人 webhook 地址
  feishu_secret: ""                       # 飞书签名密钥（可选）
  wecom_webhook_key: ""                   # 企业微信机器人 key

# ===== 监控配置（monitor 命令）=====
monitor:
  threshold: 5.0                          # 涨跌幅阈值（%）
  interval: 60                            # 轮询间隔（秒）

# ===== 反幻觉校验配置（核心特色）=====
verification:
  enabled: true                           # 是否启用数字交叉校验
  strict_mode: false                      # 严格模式：发现矛盾直接拒绝输出
  hallucination_threshold: 0.1            # 幻觉率超过10%标记为不合格
  auto_correct: true                      # 发现错误自动让模型重写

# ===== 分析维度配置（自定义你关心的指标）=====
analysis:
  include_technicals: true                # 技术面分析（MA/RSI/MACD）
  include_fundamentals: true             # 基本面分析（财务/估值）
  include_news: true                      # 资讯舆情分析
  include_industry_chain: true           # 产业链上下游分析
  include_candlestick_patterns: true      # K线形态识别（头肩顶/双底等）

# ===== 数据源配置（v3.7新增，插件式架构，不设上限）=====
data_source:
  # 用哪些数据源？可以选任意多个，写几个就用几个
  # 可选：akshare（免费）/ tushare（需Token）/ mcp（占位）/ offline（离线样例）
  sources:
    - akshare
    # - tushare      # 取消注释并配好TUSHARE_TOKEN就能用
    # - mcp          # 未来接外部MCP Server
    # - offline      # 离线样例，容灾用

  # 主数据源挂了是否自动切下一个
  auto_failover: true

  # 多源交叉验证：两个数据源同一个数字不一致，自动标记"数据存疑"
  cross_check_enabled: true

# Tushare Token（如果用tushare的话）
# tushare_token: "你的tushare token"

# ===== 高级选项 =====
advanced:
  deep_search_rounds: 2                   # 深挖模式下的补充检索轮数
  max_review_rounds: 1                    # 报告审校最大轮数
  cache_enabled: true                     # 是否启用当天数据缓存
  debate_mode: "three_way"                # 辩论模式：two_way（多空）/ three_way（技术/基本面/情绪）
